name: Platform CI

on:
    push:
        branches: [main, 'ci/**']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    DEBUG: 'napi:*'
    MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
    check:
        name: Rust checks
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --locked

            - name: Rust unit tests
              run: cargo test --locked --lib

    build:
        name: Build Linux ${{ matrix.arch }} (glibc 2.31)
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-22.04, arch: x64, target: x86_64-unknown-linux-gnu, folder: linux64 }
                    - { os: ubuntu-22.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu, folder: linuxarm64 }
        runs-on: ${{ matrix.os }}

        container:
            image: ubuntu:20.04

        steps:
            - run: apt-get update && apt-get install -y ca-certificates curl git build-essential
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2

            - name: Node install
              run: pnpm install --frozen-lockfile

            - name: Build Linux
              run: |
                  rm client.d.ts
                  test "$(node -p process.arch)" = "${{ matrix.arch }}"
                  pnpm run build --target "${{ matrix.target }}"
                  test -s client.d.ts && test -s index.d.ts

            - name: Check 0.13 contracts against the Linux release addon
              run: |
                  pnpm exec tsc --strict --noEmit --target es2020 --module node16 --types node test/v013-*/*.ts test/game-server-fixture/types.ts
                  pnpm run test:steamworks-013
                  binary="dist/${{ matrix.folder }}/steamworksjs.linux-${{ matrix.arch }}-gnu.node"
                  sh test/game-server-fixture/run.sh "$binary"
                  sh test/inventory-fixture/run.sh "$binary"

            - uses: actions/upload-artifact@v7
              if: matrix.arch == 'x64'
              with:
                  name: declarations
                  path: '*.d.ts'
                  if-no-files-found: error

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: binaries-linux-${{ matrix.arch }}
                  path: dist
                  if-no-files-found: error

    build-windows:
        name: Build Windows x64 (MSVC)
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build --target x86_64-pc-windows-msvc
            - uses: actions/upload-artifact@v7
              with:
                  name: binaries-windows
                  path: dist
                  if-no-files-found: error

    build-mac:
        name: Build macOS ${{ matrix.arch }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: macos-15, arch: arm64, target: aarch64-apple-darwin }
                    - { os: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2

            - name: Node install
              run: pnpm install --frozen-lockfile

            - run: pnpm run build --target ${{ matrix.target }}
            - name: Offline Steam SDK fixtures
              run: |
                  sh test/game-server-fixture/run.sh "dist/osx/steamworksjs.darwin-$(node -p process.arch).node"
                  sh test/inventory-fixture/run.sh "dist/osx/steamworksjs.darwin-$(node -p process.arch).node"

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: binaries-macos-${{ matrix.arch }}
                  path: dist
                  if-no-files-found: error

    package:
        runs-on: ubuntu-latest
        needs: [check, build, build-windows, build-mac]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
            - uses: actions/download-artifact@v8
              with:
                  path: dist/
                  pattern: binaries-*
                  merge-multiple: true
            - uses: actions/download-artifact@v8
              with:
                  name: declarations
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir test/typescript run compile
            - run: node test/overlay-lifecycle.cjs
            - name: Pack the release candidate
              if: github.event_name != 'workflow_dispatch' || !startsWith(github.ref, 'refs/tags/v')
              run: pnpm pack --pack-destination "$RUNNER_TEMP/candidate"
            - name: Use the existing release asset for a publication retry
              if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir "$RUNNER_TEMP/candidate"
            - name: Verify the release payload
              run: |
                  set -- "$RUNNER_TEMP"/candidate/*.tgz
                  test "$#" = 1 && test -s "$1"
                  mkdir "$RUNNER_TEMP/packed"
                  tar -xzf "$1" -C "$RUNNER_TEMP/packed"
                  cd "$RUNNER_TEMP/packed/package"
                  for file in CHANGELOG.md index.js index.d.ts client.d.ts callbacks.d.ts \
                     dist/linux64/{steamworksjs.linux-x64-gnu.node,libsteam_api.so} \
                     dist/linuxarm64/{steamworksjs.linux-arm64-gnu.node,libsteam_api.so} \
                    dist/win64/{steamworksjs.win32-x64-msvc.node,steam_api64.dll} \
                    dist/osx/{steamworksjs.darwin-x64.node,steamworksjs.darwin-arm64.node,libsteam_api.dylib}; do
                      test -s "$file" || { echo "Missing $file"; exit 1; }
                  done
                  node "$GITHUB_WORKSPACE/test/package-smoke.js" "$PWD"
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  echo '{"private":true}' > package.json
                  pnpm add "$1"
                  cp "$GITHUB_WORKSPACE/test/typescript/index.ts" .
                  "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --strict --noEmit index.ts
            - uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: ${{ runner.temp }}/candidate/*.tgz
                  if-no-files-found: error

    verify-package:
        name: Packed addon / ${{ matrix.cpu.name }} / Node ${{ matrix.node }}
        needs: package
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24, 26]
                cpu:
                    - { name: Linux x64, os: ubuntu-22.04, host: X64, platform: linux, arch: x64 }
                    - { name: Linux ARM64, os: ubuntu-22.04-arm, host: ARM64, platform: linux, arch: arm64 }
                    - { name: macOS Intel, os: macos-15-intel, host: X64, platform: darwin, arch: x64 }
                    - { name: macOS Apple Silicon, os: macos-15, host: ARM64, platform: darwin, arch: arm64 }
                    - { name: macOS x64 on Apple Silicon (Rosetta), os: macos-15, host: ARM64, platform: darwin, arch: x64 }
                    - { name: Windows x64, os: windows-2022, host: X64, platform: win32, arch: x64 }
                    - { name: Windows x64 on ARM64 (emulated), os: windows-11-arm, host: ARM64, platform: win32, arch: x64 }
        runs-on: ${{ matrix.cpu.os }}
        env:
            npm_config_arch: ${{ matrix.cpu.arch }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  architecture: ${{ matrix.cpu.arch }}
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v8
              with:
                  name: npm-package
            - name: Install under steamworks.js and check its native API
              shell: bash
              env:
                  HOST_CPU: ${{ runner.arch }}
                  EXPECTED_HOST_CPU: ${{ matrix.cpu.host }}
                  EXPECTED_PLATFORM: ${{ matrix.cpu.platform }}
                  EXPECTED_ARCH: ${{ matrix.cpu.arch }}
                  EXPECTED_NODE: ${{ matrix.node }}
              run: |
                  test "$HOST_CPU" = "$EXPECTED_HOST_CPU"
                  echo "Runner: $RUNNER_OS $HOST_CPU; Node process: $EXPECTED_ARCH"
                  node -e "const a=require('node:assert/strict'); a.equal(process.platform,process.env.EXPECTED_PLATFORM); a.equal(process.arch,process.env.EXPECTED_ARCH); a.equal(process.versions.node.split('.')[0],process.env.EXPECTED_NODE); console.log(process.version, process.platform, process.arch, require('node:os').cpus()[0].model)"
                  consumer="$RUNNER_TEMP/deviation-consumer"
                  mkdir -p "$consumer"
                  cp ./*.tgz "$consumer/steamworks.tgz"
                  cp test/deviation-game/consumer.ts "$consumer/"
                  cd "$consumer"
                  echo '{"private":true,"dependencies":{"steamworks.js":"file:./steamworks.tgz"}}' > package.json
                  pnpm install --ignore-scripts --no-frozen-lockfile
                  "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --strict --noEmit --esModuleInterop consumer.ts
                  node -e "require('node:assert/strict').equal(require('steamworks.js/package.json').name, '@kyeshmz/steamworks.ts')"
                  node "$GITHUB_WORKSPACE/test/package-smoke.js" node_modules/steamworks.js
                  (cd node_modules/steamworks.js && node "$GITHUB_WORKSPACE/test/networking-sockets.js")
            - name: Compare the published 0.4.0 game dependency and ticket behavior
              if: matrix.cpu.platform == 'linux' && matrix.cpu.arch == 'x64' && matrix.node == 22
              shell: bash
              run: |
                  reference="$RUNNER_TEMP/reference-consumer"
                  consumer="$RUNNER_TEMP/deviation-consumer"
                  mkdir "$reference"
                  echo '{"private":true,"dependencies":{"steamworks.js":"0.4.0"}}' > "$reference/package.json"
                  pnpm --dir "$reference" install --ignore-scripts --no-frozen-lockfile
                  node test/deviation-game/surface.cjs "$reference/node_modules/steamworks.js" "$consumer/node_modules/steamworks.js"
                  sh test/deviation-native/run.sh "$reference/node_modules/steamworks.js"
                  BASELINE_PACKAGE="$reference/node_modules/steamworks.js" sh test/v013-callbacks/run.sh
                  sh test/deviation-native/run.sh "$consumer/node_modules/steamworks.js"
                  sh test/deviation-native/run.sh "$consumer/node_modules/steamworks.js" overlap
            - name: Load the release package in Electron
              if: matrix.node == 22
              shell: bash
              env:
                  EXPECTED_PLATFORM: ${{ matrix.cpu.platform }}
                  EXPECTED_ARCH: ${{ matrix.cpu.arch }}
              run: |
                  if [[ "$RUNNER_OS" == Linux ]]; then
                      sudo apt-get update -qq
                      sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1
                      pnpm exec install-electron
                      helper=/opt/google/chrome/chrome-sandbox
                      if [[ -u "$helper" && "$(stat -c %u "$helper")" == 0 ]]; then
                          ln -sf "$helper" "$(node -p "require('node:path').dirname(require('electron'))")/chrome-sandbox"
                      fi
                      xvfb-run -a pnpm exec electron test/electron-package-smoke.cjs "$RUNNER_TEMP/deviation-consumer" --mute-audio
                  else
                      pnpm exec electron test/electron-package-smoke.cjs "$RUNNER_TEMP/deviation-consumer" --mute-audio
                  fi

    unsupported-windows-process:
        name: Unsupported process guard / Windows ${{ matrix.process }}
        needs: package
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: windows-11-arm, setup: arm64, process: arm64 }
                    - { os: windows-2022, setup: x86, process: ia32 }
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  architecture: ${{ matrix.setup }}
                  package-manager-cache: false
            - uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: ${{ runner.temp }}/candidate
            - shell: bash
              env:
                  EXPECTED_ARCH: ${{ matrix.process }}
              run: |
                  tar -xzf "$RUNNER_TEMP"/candidate/*.tgz
                  node -e "const a=require('node:assert/strict'); a.equal(process.platform,'win32'); a.equal(process.arch,process.env.EXPECTED_ARCH); a.throws(()=>require('./package'),{message:'Unsupported OS: win32, architecture: '+process.arch}); console.log('Explicit unsupported-process error verified for',process.arch)"

    compatibility:
        name: Platform compatibility
        if: always()
        needs: [verify-package, unsupported-windows-process]
        runs-on: ubuntu-latest
        steps:
            - run: test "$HOSTS" = success && test "$GUARDS" = success
              env:
                  HOSTS: ${{ needs.verify-package.result }}
                  GUARDS: ${{ needs.unsupported-windows-process.result }}

    release:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: compatibility
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            sha: ${{ steps.release.outputs.sha }}
            tag: ${{ steps.release.outputs.tag_name }}
        steps:
            - id: release
              uses: googleapis/release-please-action@v5
            - if: steps.release.outputs.sha == github.sha
              uses: actions/download-artifact@v8
              with:
                  name: npm-package
            - if: steps.release.outputs.sha == github.sha
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.release.outputs.tag_name }}
              run: gh release upload "$TAG" ./*.tgz --repo "$GITHUB_REPOSITORY"

    publish:
        needs: [compatibility, release]
        if: >-
            always() && needs.compatibility.result == 'success' &&
            ((needs.release.result == 'success' && needs.release.outputs.sha == github.sha) ||
             (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  registry-url: https://registry.npmjs.org
            - uses: actions/download-artifact@v8
              with:
                  name: npm-package
            - name: Publish verified tarball
              env:
                  TAG: ${{ needs.release.outputs.tag || github.ref_name }}
                  GH_TOKEN: ${{ github.token }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  gh release download "$TAG" --pattern '*.tgz' --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
                  cmp ./*.tgz "$RUNNER_TEMP"/release/*.tgz
                  tar -xOzf ./*.tgz package/package.json > manifest.json
                  node -e "const p = require('./manifest.json'); if (p.name !== '@kyeshmz/steamworks.ts' || 'v' + p.version !== process.env.TAG) process.exit(1)"
                  status=$(curl --silent --show-error -o registry.json -w '%{http_code}' \
                      "https://registry.npmjs.org/@kyeshmz%2fsteamworks.ts/${TAG#v}")
                  case "$status" in
                    404) npm publish ./*.tgz --access public --provenance ;;
                    200) expected="sha512-$(openssl dgst -sha512 -binary ./*.tgz | openssl base64 -A)"
                         test "$(jq -r '.dist.integrity' registry.json)" = "$expected" ;;
                    *) echo "Could not check npm version: HTTP $status"; exit 1 ;;
                  esac
