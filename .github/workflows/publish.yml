name: Publish

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    DEBUG: 'napi:*'
    MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --locked

            - name: Rust unit tests
              run: cargo test --locked --lib

    build:
        runs-on: ubuntu-latest

        container:
            image: ubuntu:20.04

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - run: apt-get update && apt-get install -y curl build-essential

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: x86_64-unknown-linux-gnu

            - uses: Swatinem/rust-cache@v2

            - name: Node install
              run: pnpm install --frozen-lockfile

            - name: Build Linux
              run: |
                  rm client.d.ts
                  pnpm run build --target x86_64-unknown-linux-gnu
                  test -s client.d.ts && test -s index.d.ts

            - uses: actions/upload-artifact@v7
              with:
                  name: declarations
                  path: '*.d.ts'
                  if-no-files-found: error

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: binaries-linux
                  path: dist
                  if-no-files-found: error

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build --target x86_64-pc-windows-msvc
            - uses: actions/upload-artifact@v7
              with:
                  name: binaries-windows
                  path: dist
                  if-no-files-found: error

    build-mac:
        name: Build macOS ${{ matrix.arch }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: macos-15, arch: arm64, target: aarch64-apple-darwin }
                    - { os: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2

            - name: Node install
              run: pnpm install --frozen-lockfile

            - run: pnpm run build --target ${{ matrix.target }}
            - name: Offline Steam SDK fixtures
              run: |
                  sh test/game-server-fixture/run.sh
                  sh test/inventory-fixture/run.sh

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: binaries-macos-${{ matrix.arch }}
                  path: dist
                  if-no-files-found: error

    package:
        runs-on: ubuntu-latest
        needs: [check, build, build-windows, build-mac]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
            - uses: actions/download-artifact@v8
              with:
                  path: dist/
                  pattern: binaries-*
                  merge-multiple: true
            - uses: actions/download-artifact@v8
              with:
                  name: declarations
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir test/typescript run compile
            - name: Pack and verify the release payload
              run: |
                  pnpm pack --pack-destination "$RUNNER_TEMP"
                  mkdir "$RUNNER_TEMP/packed"
                  tar -xzf "$RUNNER_TEMP"/*.tgz -C "$RUNNER_TEMP/packed"
                  cd "$RUNNER_TEMP/packed/package"
                  for file in CHANGELOG.md index.js index.d.ts client.d.ts callbacks.d.ts \
                    dist/linux64/{steamworksjs.linux-x64-gnu.node,libsteam_api.so} \
                    dist/win64/{steamworksjs.win32-x64-msvc.node,steam_api64.dll} \
                    dist/osx/{steamworksjs.darwin-x64.node,steamworksjs.darwin-arm64.node,libsteam_api.dylib}; do
                      test -s "$file" || { echo "Missing $file"; exit 1; }
                  done
                  node "$GITHUB_WORKSPACE/test/package-smoke.js" "$PWD"
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  echo '{"private":true}' > package.json
                  pnpm add "$RUNNER_TEMP"/*.tgz
                  cp "$GITHUB_WORKSPACE/test/typescript/index.ts" .
                  "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --strict --noEmit index.ts
            - uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: ${{ runner.temp }}/*.tgz
                  if-no-files-found: error

    verify-package:
        name: Node and Electron / ${{ matrix.platform }}-${{ matrix.arch }}
        needs: package
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, platform: linux, arch: x64 }
                    - { os: windows-latest, platform: win32, arch: x64 }
                    - { os: macos-15, platform: darwin, arch: arm64 }
                    - { os: macos-15-intel, platform: darwin, arch: x64 }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v8
              with:
                  name: npm-package
            - shell: bash
              run: |
                  tar -xzf ./*.tgz
                  node test/package-smoke.js package
                  (cd package && node ../test/networking-sockets.js)
            - name: Load the release package in Electron
              shell: bash
              env:
                  EXPECTED_PLATFORM: ${{ matrix.platform }}
                  EXPECTED_ARCH: ${{ matrix.arch }}
              run: |
                  if [[ "$RUNNER_OS" == Linux ]]; then
                      xvfb-run -a pnpm exec electron test/electron-package-smoke.cjs package
                  else
                      pnpm exec electron test/electron-package-smoke.cjs package
                  fi

    release:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: verify-package
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            sha: ${{ steps.release.outputs.sha }}
            tag: ${{ steps.release.outputs.tag_name }}
        steps:
            - id: release
              uses: googleapis/release-please-action@v5
            - if: steps.release.outputs.sha == github.sha
              uses: actions/download-artifact@v8
              with:
                  name: npm-package
            - if: steps.release.outputs.sha == github.sha
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.release.outputs.tag_name }}
              run: gh release upload "$TAG" ./*.tgz --repo "$GITHUB_REPOSITORY"

    publish:
        needs: [verify-package, release]
        if: >-
            always() && needs.verify-package.result == 'success' &&
            ((needs.release.result == 'success' && needs.release.outputs.sha == github.sha) ||
             (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  registry-url: https://registry.npmjs.org
            - name: Publish verified tarball
              env:
                  TAG: ${{ needs.release.outputs.tag || github.ref_name }}
                  GH_TOKEN: ${{ github.token }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  gh release download "$TAG" --pattern '*.tgz' --repo "$GITHUB_REPOSITORY"
                  tar -xOzf ./*.tgz package/package.json > manifest.json
                  node -e "const p = require('./manifest.json'); if (p.name !== '@kyeshmz/steamworks.ts' || 'v' + p.version !== process.env.TAG) process.exit(1)"
                  status=$(curl --silent --show-error -o registry.json -w '%{http_code}' \
                      "https://registry.npmjs.org/@kyeshmz%2fsteamworks.ts/${TAG#v}")
                  case "$status" in
                    404) npm publish ./*.tgz --access public --provenance ;;
                    200) expected="sha512-$(openssl dgst -sha512 -binary ./*.tgz | openssl base64 -A)"
                         test "$(jq -r '.dist.integrity' registry.json)" = "$expected" ;;
                    *) echo "Could not check npm version: HTTP $status"; exit 1 ;;
                  esac
