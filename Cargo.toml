[package]
name = "steamworksjs"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["tokio_rt", "napi6", "serde-json"] }
napi-derive = "3.6.10"
lazy_static = "1.5.1"
tokio = { version = "1.54.1", features = ["sync", "time"] }
steamworks = { git = "https://github.com/Noxime/steamworks-rs/", rev = "fbb79635b06b4feea8261e5ca3e8ea3ef42facf9", features = ["serde", "raw-bindings"] }
serde = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
